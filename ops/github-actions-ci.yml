# Copy to .github/workflows/ci.yml to enable GitHub Actions.
# Pushing workflow files over HTTPS requires a token with the `workflow` scope
# (e.g. `gh auth refresh -s workflow` or a PAT). This copy lives outside .github/
# so the rest of the repo can be pushed without that scope.

# Lint and static-export build on every push/PR. No environment variables are needed.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
